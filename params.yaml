aqi:
  fetch:
    start_date: 2024-06-01
    end_date: 2026-08-02
  horizon_hours: 24        # forecast AQI this many hours ahead
  min_history_hours: 24    # require this much lag history per row
  test_fraction: 0.20      # chronological holdout, not random
  model:
    type: hist_gradient_boosting
    max_iter: 500
    learning_rate: 0.06
    max_depth: 9
    min_samples_leaf: 40
    l2_regularization: 1.0
    early_stopping: true
    validation_fraction: 0.15
    random_state: 41

data_ingestion:
  test_size: 0.20
  random_state: 41

data_preprocessing:
  lowercase: true
  remove_urls: true
  remove_punctuations: true
  remove_numbers: true
  remove_stopwords: true
  apply_lemmatization: true
  min_words_per_tweet: 3

feature_engineering:
  vectorizer: tfidf          # TF-IDF explicitly
  max_features: 3000
  ngram_range: [1, 2]

model_building:
  model_type: random_forest
  n_estimators: 300
  max_depth: 6
  random_state: 41
  n_jobs: -1                 # use all cores

model_evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - auc